<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<script>
/* Applique thème, taille du texte et animations avant l'affichage (pas de flash). */
(function(){var P={};try{P=JSON.parse(localStorage.getItem('worldgeo.prefs'))||{};}catch(e){}
var d=document.documentElement,t=P.theme||'dark',m=window.matchMedia;
if(t==='auto')t=(m&&m('(prefers-color-scheme: light)').matches)?'light':'dark';
d.setAttribute('data-theme',t);if(P.fs&&P.fs!=='m')d.setAttribute('data-fs',P.fs);
var r=P.motion||'auto';if(r==='reduce'||(r==='auto'&&m&&m('(prefers-reduced-motion: reduce)').matches))d.classList.add('reduce');
document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='light'?'#f3f0e8':'#000000');})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Géo">
<meta name="description" content="Apprends les 194 pays du monde : nom, capitale, drapeau et localisation.">
<title>World – Géo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

  <main id="view"><div class="loading">Chargement…</div></main>
  <nav id="tabs">
    <button data-tab="home" class="active"><span class="ti">⌂</span><span>Accueil</span></button>
    <button data-tab="quiz"><span class="ti">◎</span><span>Défis</span></button>
    <button data-tab="deck"><span class="ti">▦</span><span>Cartes</span></button>
    <button data-tab="map"><span class="ti">◍</span><span>Carte</span></button>
    <button data-tab="settings"><span class="ti"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></span><span>Paramètres</span></button>
  </nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
